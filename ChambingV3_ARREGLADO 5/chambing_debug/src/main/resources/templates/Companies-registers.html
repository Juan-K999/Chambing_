<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Muli:300,700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styled.css}">
    <title>Empresas Registradas</title>
</head>
<body>
<div class="d-flex" id="content-wrapper">
    <!-- Sidebar -->
    <div id="sidebar-container" class="bg-primary">
        <div class="logo">
            <a href="/user-dashboard" class="text-light font-weight-bold mb-0 h4">
                    CHAMBING
                </a>
        </div>
        <div class="menu">
            <a href="/companies-registers" class="d-block text-light p-3 border-0 active"><i class="icon ion-md-apps lead mr-2"></i> Empresas</a>
            <a href="/only-proporsals" class="d-block text-light p-3 border-0"><i class="icon ion-md-stats lead mr-2"></i> Propuestas</a>
            <a href="/user-begin" class="d-block text-light p-3 border-0"><i class="icon ion-md-person lead mr-2"></i> Perfil</a>
        </div>
    </div>

    <div class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container">
                <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link text-dark dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                            <img src="images/user-1.png" class="rounded-circle" alt="avatar" width="35" height="35">
                            Configuración
                        </a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                            <a class="dropdown-item" href="/user-begin">Mi perfil</a>
                            <a class="dropdown-item" href="/logout">Cerrar sesión</a>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>

        <div id="content" class="bg-grey w-100">
            <section class="bg-light py-3">
                <div class="container">
                    <h1 class="font-weight-bold mb-0">Empresas Registradas</h1>
                    <p class="lead text-muted">Haz click en "Ver Propuestas" para explorar sus vacantes.</p>
                </div>
            </section>

            <section>
                <div class="container">

                    <!-- Buscador -->
                    <div class="row my-3">
                        <div class="col-md-6">
                            <input type="text" id="buscador" class="form-control"
                                   placeholder="Buscar empresa por nombre o NIT…"
                                   oninput="onBuscar()">
                        </div>
                        <div class="col-md-6 d-flex align-items-center mt-2 mt-md-0">
                            <small id="infoPaginacion" class="text-muted"></small>
                        </div>
                    </div>

                    <!-- Cards -->
                    <div class="row" id="empresasContainer">
                        <!-- Se carga dinámicamente -->
                    </div>

                    <!-- Paginación -->
                    <div class="row">
                        <div class="col-12 d-flex justify-content-center">
                            <nav>
                                <ul class="pagination" id="paginacion"></ul>
                            </nav>
                        </div>
                    </div>

                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<script>
    const POR_PAGINA = 9;

    let todasLasEmpresas = [];   // lista completa tal como llega del servidor
    let empresasFiltradas = [];  // resultado de la búsqueda
    let paginaActual = 0;

    document.addEventListener("DOMContentLoaded", cargarEmpresas);

    /* ── Carga inicial ── */
    async function cargarEmpresas() {
        const contenedor = document.getElementById("empresasContainer");
        try {
            const res = await fetch('/usuario/empresas');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            todasLasEmpresas = await res.json();
            empresasFiltradas = todasLasEmpresas;
            renderPagina(0);
        } catch (err) {
            console.error("Error cargando empresas:", err);
            contenedor.innerHTML = "<p class='text-danger'>No se pudieron cargar las empresas.</p>";
        }
    }

    /* ── Buscador con debounce ── */
    let timerBusqueda;
    function onBuscar() {
        clearTimeout(timerBusqueda);
        timerBusqueda = setTimeout(() => {
            const q = document.getElementById("buscador").value.trim().toLowerCase();
            empresasFiltradas = q
                ? todasLasEmpresas.filter(e =>
                    (e.nombreEmpresa || "").toLowerCase().includes(q) ||
                    String(e.nit || "").toLowerCase().includes(q)
                  )
                : todasLasEmpresas;
            renderPagina(0);
        }, 250);
    }

    /* ── Renderizar una página ── */
    function renderPagina(pagina) {
        paginaActual = pagina;
        const totalPaginas = Math.max(1, Math.ceil(empresasFiltradas.length / POR_PAGINA));
        if (paginaActual >= totalPaginas) paginaActual = totalPaginas - 1;

        const inicio = paginaActual * POR_PAGINA;
        const slice  = empresasFiltradas.slice(inicio, inicio + POR_PAGINA);

        /* Cards */
        const contenedor = document.getElementById("empresasContainer");
        contenedor.innerHTML = "";

        if (slice.length === 0) {
            contenedor.innerHTML = "<p class='text-muted col-12'>No se encontraron empresas.</p>";
        } else {
            slice.forEach(e => {
                const card = document.createElement("div");
                card.className = "col-lg-4 my-3";
                card.innerHTML = `
                    <div class="card rounded-0">
                        <div class="card-body">
                            <h5 class="font-weight-bold">${escHtml(e.nombreEmpresa)}</h5>
                            <p><strong>NIT:</strong> ${escHtml(e.nit)}</p>
                            <button class="btn btn-primary btn-sm"
                                    onclick="verPropuestas('${escHtml(e.idEmpresa)}')">
                                Ver Propuestas
                            </button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        /* Info */
        const desde = empresasFiltradas.length === 0 ? 0 : inicio + 1;
        const hasta = Math.min(inicio + POR_PAGINA, empresasFiltradas.length);
        document.getElementById("infoPaginacion").textContent =
            `Mostrando ${desde}–${hasta} de ${empresasFiltradas.length} empresa${empresasFiltradas.length !== 1 ? "s" : ""}`;

        /* Botones de paginación */
        renderBotonesPaginacion(totalPaginas);
    }

    /* ── Controles de paginación Bootstrap 4 ── */
    function renderBotonesPaginacion(totalPaginas) {
        const ul = document.getElementById("paginacion");
        ul.innerHTML = "";

        if (totalPaginas <= 1) return;   // no hace falta mostrar si es 1 sola página

        /* Anterior */
        ul.appendChild(crearItem("&laquo;", paginaActual - 1, paginaActual === 0));

        /* Páginas con ventana deslizante de 5 */
        const MAX = 5;
        let inicio = Math.max(0, paginaActual - Math.floor(MAX / 2));
        let fin    = Math.min(totalPaginas - 1, inicio + MAX - 1);
        if (fin - inicio < MAX - 1) inicio = Math.max(0, fin - MAX + 1);

        if (inicio > 0) {
            ul.appendChild(crearItem("1", 0));
            if (inicio > 1) ul.appendChild(crearItemDeshabilitado("…"));
        }

        for (let i = inicio; i <= fin; i++) {
            ul.appendChild(crearItem(i + 1, i, false, i === paginaActual));
        }

        if (fin < totalPaginas - 1) {
            if (fin < totalPaginas - 2) ul.appendChild(crearItemDeshabilitado("…"));
            ul.appendChild(crearItem(totalPaginas, totalPaginas - 1));
        }

        /* Siguiente */
        ul.appendChild(crearItem("&raquo;", paginaActual + 1, paginaActual >= totalPaginas - 1));
    }

    function crearItem(label, pagina, deshabilitado = false, activo = false) {
        const li = document.createElement("li");
        li.className = "page-item" +
            (deshabilitado ? " disabled" : "") +
            (activo       ? " active"   : "");
        const a = document.createElement("a");
        a.className   = "page-link";
        a.href        = "#";
        a.innerHTML   = label;
        if (!deshabilitado) {
            a.addEventListener("click", e => {
                e.preventDefault();
                renderPagina(pagina);
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }
        li.appendChild(a);
        return li;
    }

    function crearItemDeshabilitado(label) {
        const li = document.createElement("li");
        li.className = "page-item disabled";
        li.innerHTML = `<span class="page-link">${label}</span>`;
        return li;
    }

    /* ── Helpers ── */
    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function verPropuestas(idEmpresa) {
        window.location.href = `/companies-personals-profiles?empresaId=${encodeURIComponent(idEmpresa)}`;
    }
</script>

</body>
</html>
