<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Muli:300,700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styled.css">

    <title>Mis Postulaciones - CHAMBING</title>
</head>

<body>
<div class="d-flex" id="content-wrapper">

    <div id="sidebar-container" class="bg-primary">
        <div class="logo">
            <a href="/user-dashboard" class="text-light font-weight-bold mb-0 h4">CHAMBING</a>
        </div>
        <div class="menu">
            <a href="/companies-registers" class="d-block text-light p-3 border-0">
                <i class="icon ion-md-apps lead mr-2"></i> Empresas
            </a>
            <a href="/proposals-states" class="d-block text-light p-3 border-0 active">
                <i class="icon ion-md-paper lead mr-2"></i> Mis Postulaciones
            </a>
            <a href="/user-begin" class="d-block text-light p-3 border-0">
                <i class="icon ion-md-person lead mr-2"></i> Perfil
            </a>
        </div>
    </div>

    <div class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container">
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link text-dark dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <img src="images/user-1.png" class="rounded-circle" alt="avatar" width="35" height="35">
                                <span id="nombreNav">Cargando...</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="/user-begin">Mi perfil</a>
                                <a class="dropdown-item text-danger" href="/logout">Cerrar sesión</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="content" class="bg-grey w-100">
            <section class="bg-light py-3">
                <div class="container">
                    <h1 class="font-weight-bold mb-0">Mis Postulaciones</h1>
                    <p class="lead text-muted">Revisa el estado de tus postulaciones a las vacantes.</p>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12 my-3">
                            <div class="card rounded-0">
                                <div class="card-header bg-light">
                                    <h6 class="font-weight-bold mb-0">Listado de Postulaciones</h6>
                                </div>
                                <div class="card-body" id="postulaciones-body">
                                    <div class="text-center py-3">
                                        <div class="spinner-border text-primary" role="status"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>

<script>
let usuarioActual = null;

function escHtml(s) {
    return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
}

async function init() {
    try {
        const res = await fetch('/usuario/me');
        
        if (!res.ok) { 
            window.location.href = '/login'; 
            return; 
        }
        
        usuarioActual = await res.json();

        const nombreCompleto = (usuarioActual.nombre || '') + ' ' + (usuarioActual.apellido || '');
        document.getElementById('nombreNav').textContent = nombreCompleto.trim() || usuarioActual.username || 'Usuario';

        await cargarPostulaciones();
    } catch(e) {
        console.error('[INIT] Error:', e);
        window.location.href = '/login';
    }
}

async function cargarPostulaciones() {
    const container = document.getElementById('postulaciones-body');

    try {
        
        if (!usuarioActual || !usuarioActual.idUsuario) {
            container.innerHTML = `<p class="text-danger">Error: No se encontró el ID del usuario.</p>`;
            return;
        }

        const url = `/usuario/postulaciones/${usuarioActual.idUsuario}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("HTTP " + response.status);

        const postulaciones = await response.json();

        if (postulaciones.length === 0) {
            container.innerHTML = `<p class="text-muted">No has realizado postulaciones aún.</p>`;
            return;
        }

        container.innerHTML = postulaciones.map(p => {
            const estado = p.estadoPostulacion || 'Pendiente';
            let badgeColor = 'secondary';
            if (estado === 'Aprobado') badgeColor = 'success';
            if (estado === 'Rechazado') badgeColor = 'danger';
            if (estado === 'Pendiente') badgeColor = 'warning';

            let fecha = 'N/A';
            if (p.fechaPostulacion) {
                if (p.fechaPostulacion.$date) {
                    fecha = new Date(p.fechaPostulacion.$date).toLocaleDateString('es-CO');
                } else {
                    fecha = new Date(p.fechaPostulacion).toLocaleDateString('es-CO');
                }
            }

            return `
                <div class="border-bottom pb-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="font-weight-bold text-primary mb-1">${escHtml(p.propuestaTitulo || 'Sin título')}</h5>
                        <span class="badge badge-${badgeColor}">${estado}</span>
                    </div>
                    <p class="mb-0"><small><strong>Fecha de postulación:</strong> ${fecha}</small></p>
                </div>
            `;
        }).join('');

    } catch (error) {
        console.error('[CARGAR] Error:', error);
        container.innerHTML = `<p class="text-danger">No se pudieron cargar tus postulaciones: ${escHtml(error.message)}</p>`;
    }
}


if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
