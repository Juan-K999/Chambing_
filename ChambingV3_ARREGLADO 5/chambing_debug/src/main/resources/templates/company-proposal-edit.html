<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Muli:300,700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styled.css">

    <title>Editar Propuesta - CHAMBING</title>
</head>

<body>
<div class="d-flex" id="content-wrapper">

    <div id="sidebar-container" class="bg-primary">
        <div class="logo">
            <a href="/company-dashboard" class="text-light font-weight-bold mb-0 h4">CHAMBING</a>
        </div>
        <div class="menu">
            <a href="/company-dashboard" class="d-block text-light p-3 border-0">
                <i class="icon ion-md-apps lead mr-2"></i> Mis Propuestas
            </a>
            <a href="/company-proposals" class="d-block text-light p-3 border-0">
                <i class="icon ion-md-add-circle lead mr-2"></i> Nueva Propuesta
            </a>
            <a href="/edit-propuesta" class="d-block text-light p-3 border-0 active">
                <i class="icon ion-md-create lead mr-2"></i> Editar Propuestas
            </a>
            <a href="/company-profile" class="d-block text-light p-3 border-0">
                <i class="icon ion-md-person lead mr-2"></i> Mi Perfil
            </a>
        </div>
    </div>

    <div class="w-100">
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
            <div class="container">
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link text-dark dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                                <img src="images/user-1.png" class="rounded-circle" alt="avatar" width="35" height="35">
                                <span id="nombreNav">Cargando...</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-right">
                                <a class="dropdown-item" href="/company-profile">Mi perfil</a>
                                <a class="dropdown-item text-danger" href="/logout">Cerrar sesión</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div id="content" class="bg-grey w-100">
            <section class="bg-light py-3">
                <div class="container">
                    <h1 class="font-weight-bold mb-0">Editar Propuesta</h1>
                    <p class="lead text-muted">Modifica los detalles de tu oferta laboral.</p>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12 my-3">
                            <div class="card rounded-0">
                                <div class="card-header bg-primary text-white">
                                    <h6 class="font-weight-bold mb-0">Editar Propuesta de Trabajo</h6>
                                </div>
                                <div class="card-body">
                                    <form id="form-propuesta">
                                        <div class="form-row">
                                            <div class="form-group col-md-8">
                                                <label>Título de la Propuesta</label>
                                                <input type="text" class="form-control" id="inputTitulo" required>
                                            </div>
                                            <div class="form-group col-md-4">
                                                <label>Salario (Mensual)</label>
                                                <input type="number" class="form-control" id="inputSalario" required>
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="form-group">
                                            <label>Descripción del Puesto</label>
                                            <textarea class="form-control" id="inputDescripcion" rows="4" required></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label>Requisitos Mínimos</label>
                                            <textarea class="form-control" id="inputRequisitos" rows="3" required></textarea>
                                        </div>
                                        <hr>
                                        <div class="form-row">
                                            <div class="form-group col-md-6">
                                                <label>Categoría / Área</label>
                                                <select id="selectCategoria" class="form-control" required>
                                                    <option value="">Elegir Categoría...</option>
                                                    <option value="Tecnología y Desarrollo">Tecnología y Desarrollo</option>
                                                    <option value="Marketing Digital">Marketing Digital</option>
                                                    <option value="Recursos Humanos">Recursos Humanos</option>
                                                    <option value="Administración y Finanzas">Administración y Finanzas</option>
                                                </select>
                                            </div>
                                            <div class="form-group col-md-6">
                                                <label>Estado de la Publicación</label>
                                                <select id="selectEstado" class="form-control" required>
                                                    <option value="">Elegir Estado...</option>
                                                    <option value="Activa">Activa (Visible)</option>
                                                    <option value="Borrador">Borrador (No Visible)</option>
                                                    <option value="Cerrada">Cerrada</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-success mt-3">
                                            <i class="icon ion-md-send mr-2"></i>Guardar Cambios
                                        </button>
                                        <a href="/company-dashboard" class="btn btn-secondary mt-3">Cancelar</a>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>

<script>
    let empresaActual = null;
    const propuestaId = new URLSearchParams(window.location.search).get('id');

    async function init() {
        try {
            const res = await fetch('/empresa/me');
            if (!res.ok) {
                window.location.href = '/login';
                return;
            }

            empresaActual = await res.json();
            document.getElementById('nombreNav').textContent = empresaActual.nombreEmpresa || 'Empresa';

            if (!propuestaId) {
                alert('No se especificó una propuesta a editar.');
                window.location.href = '/edit-propuesta';
                return;
            }

            await cargarPropuesta();
        } catch (e) {
            console.error(e);
            window.location.href = '/login';
        }
    }

    async function cargarPropuesta() {
        try {
            const res = await fetch(`/empresa/${empresaActual.idEmpresa}/propuestas`);
            const propuestas = await res.json();

            const p = propuestas.find(prop => prop.idPropuesta === propuestaId);
            if (!p) {
                alert('Propuesta no encontrada');
                window.location.href = '/company-dashboard';
                return;
            }

            document.getElementById('inputTitulo').value      = p.titulo || '';
            document.getElementById('inputSalario').value     = p.salario || '';
            document.getElementById('inputDescripcion').value = p.descripcion || '';
            document.getElementById('inputRequisitos').value  = p.requisitos || '';

            if (p.categoria) document.getElementById('selectCategoria').value = p.categoria;
            if (p.estado)    document.getElementById('selectEstado').value    = p.estado;

        } catch (err) {
            console.error(err);
            alert("Error al cargar la propuesta");
        }
    }

    document.getElementById('form-propuesta').addEventListener('submit', async function (e) {
        e.preventDefault();

        const data = {
            titulo:      document.getElementById('inputTitulo').value.trim(),
            salario:     parseFloat(document.getElementById('inputSalario').value) || 0,
            descripcion: document.getElementById('inputDescripcion').value.trim(),
            requisitos:  document.getElementById('inputRequisitos').value.trim(),
            categoria:   document.getElementById('selectCategoria').value,
            estado:      document.getElementById('selectEstado').value
        };

        try {
            const response = await fetch(`/empresa/${empresaActual.idEmpresa}/propuestas/${propuestaId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('¡Propuesta actualizada correctamente!');
                window.location.href = '/company-dashboard';
            } else {
                const errorText = await response.text();
                alert('Error al actualizar: ' + errorText);
            }
        } catch (err) {
            console.error(err);
            alert('Error de conexión con el servidor');
        }
    });

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
