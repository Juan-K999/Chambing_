<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador - Chambing</title>
    <style>
        body {
            background: #eef1f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Chambing Admin</h2>

    <input type="text" id="user" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">Ingresar</button>

    <div id="error" class="error"></div>
</div>

<script>
    async function login() {
        const user = document.getElementById("user").value;
        const password = document.getElementById("password").value;

        const res = await fetch("/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user, password })
        });

        if (res.status === 200) {
            const data = await res.json();
            window.location.href = data.redirect;
        } else {
            document.getElementById("error").innerText = "Credenciales incorrectas";
        }
    }
</script>

</body>
</html>
