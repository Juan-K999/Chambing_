<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Muli:300,700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styled.css}">
    <title>Perfil de Empresa</title>
</head>

<body>
    <div class="d-flex" id="content-wrapper">

        <!-- Sidebar -->
        <div id="sidebar-container" class="bg-primary">
            <div class="logo">
                <h4 class="text-light font-weight-bold mb-0">CHAMBING</h4>
            </div>
            <div class="menu">
                <a href="/companies-registers" class="d-block text-light p-3 border-0"><i class="icon ion-md-apps lead mr-2"></i> Empresas</a>
                <a href="/only-proporsals" class="d-block text-light p-3 border-0"><i class="icon ion-md-stats lead mr-2"></i> Propuestas</a>
                <a href="/user-begin" class="d-block text-light p-3 border-0"><i class="icon ion-md-person lead mr-2"></i> Perfil</a>
            </div>
        </div>

       
        <div class="w-100">

            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container">
                    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto mt-2 mt-lg-0">
                            <li class="nav-item dropdown">
                                <a class="nav-link text-dark dropdown-toggle" href="#" id="navbarDropdown" role="button"
                                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <img src="images/user-1.png" class="rounded-circle" alt="avatar" width="35" height="35">
                                    <span id="nombreNav">Configuración</span>
                                </a>
                                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" href="/user-begin">Mi perfil</a>
                                    <a class="dropdown-item" href="/logout">Cerrar sesión</a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Contenido -->
            <div id="content" class="bg-grey w-100">
                <section class="bg-light py-3">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12">
                                <h1 class="font-weight-bold mb-0" id="empresa-nombre">Empresa</h1>
                                <p class="lead text-muted" id="empresa-nit">NIT: </p>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-8 my-3">
                                <div class="card rounded-0">
                                    <div class="card-header bg-light">
                                        <h6 class="font-weight-bold mb-0">Propuestas de la empresa</h6>
                                    </div>
                                    <div class="card-body" id="contenedor-propuestas">
                                        
                                        <p>Cargando propuestas...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <script>
    let usuarioActual = null;
    let empresaId = null;

    function escHtml(s) {
        return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
    }

    function obtenerEmpresaId() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('empresaId');
        console.log('[INIT] empresaId obtenido:', id);
        return id;
    }

    async function init() {
        try {
            const res = await fetch('/usuario/me');
            if (!res.ok) { 
                window.location.href = '/login'; 
                return; 
            }

            usuarioActual = await res.json();

            const nombreCompleto = (usuarioActual.nombre || '') + ' ' + (usuarioActual.apellido || '');
            document.getElementById('nombreNav').textContent = nombreCompleto.trim() || 'Usuario';

            empresaId = obtenerEmpresaId();

            if (!empresaId) {
                alert("No se especificó la empresa");
                window.location.href = "/companies-registers";
                return;
            }

            await cargarEmpresa(empresaId);
            await cargarPropuestas(empresaId);

        } catch(e) {
            console.error('[INIT ERROR]', e);
            window.location.href = '/login';
        }
    }

    // 🔥 FIX: validar respuesta y log
    async function cargarEmpresa(id) {
        try {
            const response = await fetch(`/empresa/${id}`);

            console.log('[EMPRESA STATUS]', response.status);

            if (!response.ok) {
                const text = await response.text();
                console.error('[EMPRESA ERROR]', text);
                throw new Error(text);
            }

            const empresa = await response.json();
            console.log('[EMPRESA DATA]', empresa);

            document.getElementById('empresa-nombre').textContent = escHtml(empresa.nombreEmpresa || 'Empresa');
            document.getElementById('empresa-nit').textContent = `NIT: ${escHtml(empresa.nit || '')}`;

        } catch (error) {
            console.error("[EMPRESA ERROR]", error);
            document.getElementById('empresa-nombre').textContent = "Empresa no encontrada";
        }
    }

    // 🔥 FIX IMPORTANTE AQUÍ
    async function cargarPropuestas(idEmpresa) {
        const contenedor = document.getElementById('contenedor-propuestas');

        try {
            const response = await fetch(`/empresa/${idEmpresa}/propuestas`);

            console.log('[PROPUESTAS STATUS]', response.status);

            const text = await response.text();
            console.log('[PROPUESTAS RAW]', text);

            if (!response.ok) throw new Error(text);

            const propuestas = JSON.parse(text);

            contenedor.innerHTML = "";

            // 🔥 FIX: validar array correctamente
            if (!Array.isArray(propuestas) || propuestas.length === 0) {
                contenedor.innerHTML = "<p class='text-muted'>Esta empresa no tiene propuestas disponibles.</p>";
                return;
            }

            propuestas.forEach(p => {

                // 🔥 FIX: soportar _id o idPropuesta
                const idProp = p.idPropuesta || p._id;

                const cardHtml = `
                    <div class="border-bottom pb-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="font-weight-bold text-primary">${escHtml(p.titulo)}</h5>
                            <span class="badge badge-success">$ ${escHtml(String(p.salario || 'Negociable'))}</span>
                        </div>
                        <p class="text-muted mb-1">
                            <i class="icon ion-md-business"></i> ${escHtml(p.empresaNombre || 'Empresa')} 
                            ${p.categoria ? ' | <i class="icon ion-md-pricetag"></i> ' + escHtml(p.categoria) : ''}
                        </p>
                        <p>${escHtml(p.descripcion || '')}</p>
                        <p><small><strong>Requisitos:</strong> ${escHtml(p.requisitos || '')}</small></p>
                        <button onclick="aplicarOferta('${idProp}')" class="btn btn-primary btn-sm">
                            Aplicar Ahora
                        </button>
                    </div>
                `;
                contenedor.innerHTML += cardHtml;
            });

        } catch (error) {
            console.error("[PROPUESTAS ERROR]", error);
            contenedor.innerHTML = "<p class='text-danger'>No se pudieron cargar las propuestas.</p>";
        }
    }

    async function aplicarOferta(idPropuesta) {
        if (!usuarioActual) {
            window.location.href = "/login";
            return;
        }

        try {
            const response = await fetch(`/usuario/aplicar/${usuarioActual.idUsuario}/${idPropuesta}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert("¡Te has postulado correctamente!");
            } else {
                const mensaje = await response.text();
                alert("Error: " + mensaje);
            }

        } catch (error) {
            console.error('[APLICAR ERROR]', error);
            alert("Error de conexión.");
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
